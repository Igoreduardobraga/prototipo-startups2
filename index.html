<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunus EMS - Sistema Inteligente de Gestão Energética</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: #121212;
      min-height: 100vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }

    .energy-flow {
      animation: energyPulse 3s infinite ease-in-out;
    }

    @keyframes energyPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .metric-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.1) 100%);
      backdrop-filter: blur(15px);
      transition: all 0.3s ease;
    }

    .metric-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    .nav-active {
      background: rgba(255,255,255,0.2);
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .progress-ring {
      transform: rotate(-90deg);
    }

    .charging-animation {
      animation: charging 2s infinite linear;
    }

    @keyframes charging {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .revenue-chart {
      background: linear-gradient(45deg, #00c851, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body>
<div id="app" class="min-h-screen">
  <header class="glass-card m-4 p-4 sticky top-4 z-50">

            <path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/>

        </div>
      </div>
      
      <nav class="flex flex-wrap gap-2">
        <button id="nav-dashboard" onclick="changeView('dashboard')" class="nav-button px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300">

          💰 Receitas
        </button>
        <button id="nav-sustentabilidade" onclick="changeView('sustentabilidade')" class="nav-button px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300">
          🌱 ESG
        </button>
        <button id="nav-alertas" onclick="changeView('alertas')" class="nav-button px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300">

  <main class="px-4 pb-8">

function getStatusColor(status) {
  switch (status) {
    case 'Carregando': return 'bg-green-500 bg-opacity-20 text-green-400';
    case 'Disponível': return 'bg-blue-500 bg-opacity-20 text-blue-400';
    case 'Reservado': return 'bg-yellow-500 bg-opacity-20 text-yellow-400';
    case 'Ocupado': return 'bg-orange-500 bg-opacity-20 text-orange-400';
    default: return 'bg-gray-500 bg-opacity-20 text-gray-400';
  }
}

function updateNavButtons(activeView) {
  document.querySelectorAll('.nav-button').forEach(button => {
    if (button.id === `nav-${activeView}`) {
      button.classList.add('nav-active');
      button.classList.remove('text-blue-200', 'hover:bg-white', 'hover:bg-opacity-10');
    } else {
      button.classList.remove('nav-active');
      button.classList.add('text-blue-200', 'hover:bg-white', 'hover:bg-opacity-10');
    }
  });
}

function changeView(view) {
  currentView = view;
  updateNavButtons(view);
  
  switch (view) {
    case 'dashboard':
      renderDashboard();
      break;
    case 'eletropostos':
      renderEletropostos();
      break;
    case 'financeiro':
      renderFinanceiro();
      break;
    case 'sustentabilidade':
      renderSustentabilidade();
      break;
    case 'alertas':
      renderAlertas();
      break;
  }
}

window.onload = () => {
  changeView('dashboard');
  
  // Simular atualizações em tempo real
  setInterval(() => {
    if (currentView === 'dashboard') {
      mockData.dashboard.solarGeneration += (Math.random() - 0.5) * 2;
      mockData.dashboard.totalConsumption += (Math.random() - 0.5) * 1.5;
      mockData.dashboard.bessCharge += (Math.random() - 0.5) * 0.5;
      
      mockData.dashboard.solarGeneration = Math.max(0, Math.min(100, mockData.dashboard.solarGeneration));
      mockData.dashboard.totalConsumption = Math.max(0, Math.min(80, mockData.dashboard.totalConsumption));
      mockData.dashboard.bessCharge = Math.max(0, Math.min(100, mockData.dashboard.bessCharge));
      
      renderDashboard();
    }
  }, 10000);
};
